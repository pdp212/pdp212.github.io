<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Portfolio — Phan Duc Phat</title>
  <meta name="description" id="pageDesc" content="" />
  <meta name="keywords" content="Phan Duc Phat, Video Editor, Camera Operator, Motion Designer, Hải Châu, Đà Nẵng, Silver Swallows Studio, Adobe Premiere, After Effects, DaVinci Resolve, Generative AI" />
  <meta property="og:title" id="ogTitle" content="" />
  <meta property="og:description" content="Technical precision. Cinematic vision. Elevating every frame." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pdp212.github.io" />
  <meta name="theme-color" content="#000000" />
  <link rel="canonical" href="https://pdp212.github.io" />
  <link rel="icon" href="assets/images/profile/logo-pdp-white.png" type="image/png" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Phan Duc Phat",
    "url": "https://pdp212.github.io",
    "jobTitle": "Video Editor & Camera Operator | Motion Designer",
    "worksFor": {
      "@type": "Organization",
      "name": "Silver Swallows Studio"
    },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Hải Châu, Đà Nẵng",
      "addressCountry": "VN"
    },
    "sameAs": [
      "https://www.linkedin.com/in/phanducphat23",
      "https://www.behance.net/pdp23"
    ]
  }
  </script>

  <!-- Typography: ONLY Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="loading">

  <!-- ═ PAGE REVEAL ═ -->
  <div class="page-reveal" id="pageReveal">
    <span class="reveal-logo">PDP</span>
  </div>

  <!-- ═ NAV ═ -->
  <nav id="navbar" class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="#home" class="nav-logo" aria-label="PDP — Back to Home">PDP</a>
      <ul class="nav-links" role="list">
        <li><a href="#home" class="nav-link active" aria-current="page">Home</a></li>
        <li><a href="#work" class="nav-link">Work</a></li>
        <li><a href="#profile" class="nav-link">Profile</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>
      <button class="nav-burger" id="navBurger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-mobile" id="navMobile" aria-hidden="true">
      <a href="#home" class="nav-mobile-link">Home</a>
      <a href="#work" class="nav-mobile-link">Work</a>
      <a href="#profile" class="nav-mobile-link">Profile</a>
      <a href="#contact" class="nav-mobile-link">Contact</a>
    </div>
  </nav>

  <!-- ═ 4-PAGE SPA VIEWS ═ -->
  <main id="appContent" class="app-content">
    <div id="page-home" class="page-view active" role="region" aria-label="Home page"></div>
    <div id="page-work" class="page-view" role="region" aria-label="Work portfolio page" aria-hidden="true"></div>
    <div id="page-profile" class="page-view" role="region" aria-label="Profile and biography page" aria-hidden="true"></div>
    <div id="page-contact" class="page-view" role="region" aria-label="Contact information page" aria-hidden="true"></div>
  </main>

  <!-- ═ CINEMATIC VIDEO TRANSITION OVERLAY ═ -->
  <div class="page-transition-video" id="pageTransitionVideo" aria-hidden="true">
    <video class="page-transition-video-element" id="pageTransitionVideoElement" playsinline webkit-playsinline muted preload="auto"></video>
  </div>

  <!-- ═ CINEMATIC PAGE TRANSITION SHUTTER ═ -->
  <div class="page-transition-shutter" id="pageTransitionShutter" aria-hidden="true">
    <div class="shutter-line"></div>
  </div>

  <!-- ═ LIGHTBOX ═ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Project detail" aria-hidden="true">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-panel">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close lightbox">✕</button>
      <div class="lightbox-content" id="lightboxContent">
        <div class="lightbox-visual" id="lightboxVisual"></div>
        <div class="lightbox-info">
          <!-- Rendered dynamically by lightbox.js -->
        </div>
      </div>
    </div>
  </div>

  <!-- ═ CINEMA FULLSCREEN SCREENING ROOM OVERLAY ═ -->
  <div class="cinema-fullscreen-overlay" id="cinemaFullscreenOverlay" role="dialog" aria-modal="true" aria-label="Film Screening Room" aria-hidden="true">
    <div class="cinema-fullscreen-video-container">
      <video class="cinema-fullscreen-video" id="cinemaFullscreenVideo" playsinline webkit-playsinline preload="auto"></video>
      <div class="cinema-fullscreen-grain" aria-hidden="true"></div>
    </div>
    <button class="cinema-back-btn" id="cinemaBackBtn" type="button" aria-label="Exit screening and return to cinema room">
      <span class="cinema-back-text">BACK</span>
    </button>
  </div>

  <!-- ═ DATA LAYER ═ -->
  <script src="data/profile.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/work-data.js"></script>
  <script src="data/work-mock.js"></script>
  <script src="data/about.js"></script>
  <script src="data/contact.js"></script>

  <!-- ═ UTILITIES ═ -->
  <script src="src/utils/dom.js"></script>
  <script src="src/utils/media.js"></script>
  <script src="src/utils/accessibility.js"></script>

  <!-- ═ PAGE MODULES ═ -->
  <script src="src/render/hero.js"></script>
  <script src="src/render/ai.js"></script>
  <script src="src/pages/home.js"></script>
  <script src="src/pages/work.js"></script>
  <script src="src/pages/profile.js"></script>
  <script src="src/pages/contact.js"></script>

  <!-- ═ APP ENTRY ═ -->
  <script src="src/app.js"></script>

  <!-- ═ INTERACTIONS & ROUTING (after DOM is populated) ═ -->
  <script src="src/interactions/scroll.js"></script>
  <script src="src/interactions/lightbox.js"></script>
  <script src="src/interactions/cursor.js"></script>
  <script src="src/interactions/animations.js"></script>
  <script src="src/interactions/transitions.js"></script>
  <script src="src/interactions/videoTransitions.js"></script>
  <script src="src/interactions/navigation.js"></script>

  <!-- ═ EFFECTS ═ -->
  <script src="effects/effects.js"></script>

</body>
</html>
